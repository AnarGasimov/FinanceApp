name: Go

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: root
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
       path: ./FinanceApp
    - name: Check Directory Structure
      run: ls -R 
    - name: Check make
      run: ls -la 
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.0'
      id: go
    - name: Install golang-migrate
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.2/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/bin/migrate
        which migrate
    - name: Run migrations
      run: make migrateup
    - name: Test
      run: make test