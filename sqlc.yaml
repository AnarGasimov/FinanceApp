version: 2
sql:
  - schema: "./internal/db/migration/"
    queries: "./internal/db/query/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        out: "./internal/db/sqlc"